services:
  # ── Web Service ─────────────────────────────────────────────────────────────
  - type: web
    name: support-agent-web
    env: python
    plan: free
    region: singapore          # closest to India
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput --settings=config.settings.production &&
      python manage.py migrate --settings=config.settings.production
    startCommand: >
      gunicorn config.wsgi:application
      --workers 1
      --threads 4
      --timeout 300
      --bind 0.0.0.0:$PORT
      --log-level info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false           # set manually to Supabase database connection string in Render dashboard
      - key: REDIS_URL
        sync: false           # set manually to Upstash Redis secure (rediss://) URL in Render dashboard
      - key: GEMINI_API_KEY
        sync: false           # set manually in Render dashboard
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SUPABASE_URL
        sync: false           # set manually in Render dashboard
      - key: SUPABASE_KEY
        sync: false           # set manually in Render dashboard
      - key: SUPABASE_BUCKET
        value: "ai-customer-support-pdfs"

  # ── Celery Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: support-agent-worker
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: >
      celery -A config worker
      --loglevel=info
      --concurrency=1
      --pool=solo
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        fromService:
          name: support-agent-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false           # set manually to Supabase database connection string in Render dashboard
      - key: REDIS_URL
        sync: false           # set manually to Upstash Redis secure (rediss://) URL in Render dashboard
      - key: GEMINI_API_KEY
        sync: false           # set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false           # set manually in Render dashboard
      - key: SUPABASE_KEY
        sync: false           # set manually in Render dashboard
      - key: SUPABASE_BUCKET
        value: "ai-customer-support-pdfs"


