services:

  # ── Web Service (Django + Gunicorn) ─────────────────────────────────────────
  # No Celery worker needed — document processing runs inside a daemon thread
  # within this web process via the built-in fallback in support/views.py.
  - type: web
    name: support-agent-web
    env: python
    plan: free
    region: singapore

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput --settings=config.settings.production
      python manage.py migrate --settings=config.settings.production

    startCommand: |
      gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT --log-level info

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SUPABASE_BUCKET
        value: "ai-customer-support-pdfs"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
