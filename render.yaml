services:

  # ── Web Service (Django + Gunicorn) ─────────────────────────────────────────
  # NOTE: Render free plan does NOT support background worker services.
  # Document processing is handled by a daemon thread inside this web process
  # via the built-in Celery thread fallback in support/views.py.
  - type: web
    name: support-agent-web
    env: python
    plan: free
    region: singapore

    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput --settings=config.settings.production &&
      python manage.py migrate --settings=config.settings.production

    # 1 worker + 4 threads: background document-processing threads share
    # the same process without consuming too much RAM on the free tier.
    # timeout 300 gives PDF processing enough time before gunicorn kills the worker.
    startCommand: >
      gunicorn config.wsgi:application
      --workers 1
      --threads 4
      --timeout 300
      --bind 0.0.0.0:$PORT
      --log-level info

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SUPABASE_BUCKET
        value: "ai-customer-support-pdfs"

      # ── Set these manually in the Render dashboard ──
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
