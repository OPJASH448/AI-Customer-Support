version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_support_db
    restart: always
    
    environment:
      POSTGRES_DB: ai_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    
    ports:
      - "5433:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_support_redis
    restart: always
    
    ports:
      - "6380:6379"
    
    volumes:
      - redis_data:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
